[config.wallpaper]
command = "plasma-apply-wallpaperimage" 
set = false

[templates.vicinae]
input_path = './templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen'

[templates.kitty]
input_path = './templates/kitty.toml'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = 'kitty +kitten themes --reload-in=all Matugen'

[templates.vesktop]
input_path = './templates/discord.toml'
output_path = '~/.config/equibop/themes/material_you.css'

[templates.yazi]
input_path = './templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.btop]
input_path = './templates/btop.toml'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.gtk3]
input_path = './templates/gtk.toml'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = './templates/gtk.toml'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.obs]
input_path = './templates/obs.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'

[templates.obsidian]
input_path = './templates/obsidian.css'
output_path = '~/Dev/Notes/ReyVault/.obsidian/snippets/matugen.css'

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.opencode]
input_path = './templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.kcolorscheme]
input_path = './templates/kcolorscheme.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.lightkcolorscheme]
input_path = './templates/light-kcolorscheme.colors'
output_path = '~/.local/share/color-schemes/MatugenLight.colors'

[templates.darkkcolorscheme]
input_path = './templates/dark-kcolorscheme.colors'
output_path = '~/.local/share/color-schemes/MatugenDark.colors'
